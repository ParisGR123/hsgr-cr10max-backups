# This file contains common pin mappings for the BIGTREETECH SKR mini
# E3 v3.0. To use this config, the firmware should be compiled for the
# STM32G0B1 with a "8KiB bootloader" and USB communication/USART.

# The "make flash" command does not work on the SKR mini E3. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini E3 with that SD card.

# See docs/Config_Reference.md for a description of parameters.

[include mainsail.cfg]
[include bigtreetech-eddy-homing.cfg]
[include custom_macros.cfg]
[exclude_object]




[bed_screws]
screw1: 35, 35
screw2: 425, 35
screw3: 425, 425
screw4:	35, 425

[screws_tilt_adjust]
screw1: 89.5, 40
screw2: 449.5, 40
screw3: 449.5, 430
screw4: 89.5, 430
speed: 50 
horizontal_move_z: 10 
screw_thread: CW-M4


[filament_switch_sensor filament_sensor]
pause_on_runout: true
debounce_delay: 0.5
switch_pin: PC15

#[bltouch]
#sensor_pin: ^PC14 #Remove ^ if print head crashes into bed, the ^ is for the CR touch a bl touch should work without.
#control_pin: PA1
#x_offset: -40
#y_offset: -10
#z_offset: 3.0
#speed:

[safe_z_home]
home_xy_position: 225,225 # Change coordinates to the center of your print bed
speed: 50
z_hop: 10                 # Move up 10mm
z_hop_speed: 5

#[bed_mesh]
#speed: 120
#horizontal_move_z: 5
#mesh_min: 0, 0
#mesh_max: 450, 450
#probe_count: 5,5

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: -5
position_min: -5
position_max: 450
homing_speed: 50
homing_retract_dist: 0


[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
diag_pin: ^PC0
uart_address: 0
run_current: 0.580
hold_current: 0.500
stealthchop_threshold: 999999
driver_SGTHRS: 90

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: -15
position_max: 450
position_min: -15
homing_speed: 50
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
diag_pin: ^PC1
uart_address: 2
run_current: 1
hold_current: 0.7
stealthchop_threshold: 999999
driver_SGTHRS: 80

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
# endstop_pin: ^PC2
# position_endstop: 0.0
endstop_pin: probe:z_virtual_endstop
position_max: 400
position_min: -2

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.580
hold_current: 0.500
stealthchop_threshold: 999999

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 22.7465
nozzle_diameter: 0.6
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 0
max_temp: 280
pressure_advance: 0.12

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.650
hold_current: 0.500
stealthchop_threshold: 999999

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0
max_temp: 130

[heater_fan controller_fan]
pin: PB15
heater: heater_bed
heater_temp: 45.0

[heater_fan nozzle_cooling_fan]
pin: PC7

[fan]
pin: PC6

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_5400160013504D5930313820-if00
# serial: /dev/ttyAMA0
# restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>


######################################################################
#  BigTreeTech TFT TouchScreen emulated 12864 mode
######################################################################

[display]
lcd_type: emulated_st7920
spi_software_miso_pin: PD8 # status led, Virtual MISO
spi_software_mosi_pin: PD6
spi_software_sclk_pin: PB9
en_pin: PB8
encoder_pins: ^PA10, ^PA9
click_pin: ^!PA15

[output_pin beeper]
pin: PB5

[gcode_macro START_PRINT]
gcode:
	{% set BED_TEMP = params.BED|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(200)|float %}
  
    M117 Preheating bed...
    M190 S{BED_TEMP}
    M104 S140
    
    {% if "xyz" not in printer.toolhead.homed_axes %}
    M117 Homing...
    G28
	{% endif %}

    M117 Levelling...
    BED_MESH_CALIBRATE ADAPTIVE=1 

	M117 Heating Nozzle...
    M104 S{EXTRUDER_TEMP}
    M109 S{EXTRUDER_TEMP}

    M117 Purging nozzle...
    G90                             # Absolute positioning
    G1 Z2.0 F3000                   # Move Z up slightly
    G1 X182 Y-5 Z0.6 F5000.0        # Move to start position (front left)
    G92 E0                          # Reset Extruder
    G1 X275 Y-5 Z0.6 F1500.0 E15 # Draw first purge line
    G1 X275 Y-4 Z0.6 F5000.0     # Move to side slightly
    G1 X182 Y-4 Z0.6 F1500.0 E30    # Draw second purge line
    G92 E0                          # Reset Extruder
    G1 Z2.0 F3000                   # Move Z up to avoid scraping
    G1 X182 Y-6 Z0.3 F5000.0          # Quick wipe away

    M117 Printing...


[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100


[gcode_macro END_PRINT]
gcode:
	# 1. Get Boundaries
	{% set max_x = printer.toolhead.axis_maximum.x|float %}
	{% set max_y = printer.toolhead.axis_maximum.y|float %}
	{% set max_z = printer.toolhead.axis_maximum.z|float %}
  	{% set act_z = printer.toolhead.position.z|float %}

  	# 2. Determine Safe Z Lift Height
  	{% if act_z < (max_z - 2.0) %}
    	{% set z_safe = 2.0 %}
  	{% else %}
      	{% set z_safe = max_z - act_z %}
  	{% endif %}

  	# 3. Execute End Movements
  	G91 ; Relative positioning
  	G1 E-2 F2700 ; Retract 2mm of filament to prevent oozing
  	G1 Z{z_safe} F900 ; Lift nozzle safely away from print
    
  	G90 ; Absolute positioning
  	G1 X{max_x / 2} Y{max_y - 10} F3000 ; Center X, push bed forward (Y max - 10mm)

  	# 4. Turn Off Components
  	M104 S0 ; Turn off extruder
  	M140 S0 ; Turn off bed
  	M106 S0 ; Turn off cooling fan
  	M84 ; Disable steppers

